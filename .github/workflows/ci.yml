name: ci

on:
  pull_request:
  push:
    branches: [main]

# Every job here only checks out and runs read-only test/lint commands, so pin
# GITHUB_TOKEN to read-only rather than inheriting the repo/org default (which
# can be write).
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          # Track the toolchain the module declares instead of pinning a second
          # version here that would drift from go.mod.
          go-version-file: src/claude-queue/go.mod
      - run: make -C src/claude-queue test vet fmt-check

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: run bin/ script tests
        run: |
          for t in test/*.test.sh; do bash "$t" || exit 1; done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Files are listed one by one rather than globbed, for two reasons.
      # `bin/claude-queue` is a build artifact (a gitignored Go binary), so
      # `bin/*` would hand shellcheck something it cannot parse. And three legacy
      # scripts -- bin/deploy.sh, bin/list-install.sh, bin/ghq-tmux-session --
      # still carry warnings; cleaning those up is separate work, so the gate
      # covers only what is already at zero. Adding a script means adding a line
      # here.
      - name: shellcheck
        run: |
          shellcheck -S warning \
            bin/claude-digest \
            bin/claude-hook-git-guard \
            bin/claude-review \
            bin/claude-session \
            bin/claude-spinoff \
            bin/claude-stop-bg \
            bin/claude-worktree \
            bin/db-query \
            bin/gh-automerge \
            bin/gh-await-reviews \
            bin/gh-issue-file \
            bin/gh-issue-group \
            bin/gh-issue-mark-delegated \
            bin/issue-crawl \
            bin/gh-list-threads \
            bin/gh-pr-checks \
            bin/gh-pr-comments \
            bin/gh-pr-create \
            bin/gh-pr-edit-body \
            bin/gh-reply-thread \
            bin/gh-request-approval \
            bin/gh-resolve-thread \
            bin/git-reap-gone \
            bin/git-set-commit-sign \
            bin/lib/claude-queue-db.sh \
            bin/lib/dotrc-config.sh \
            bin/lib/gh-mise.sh \
            bin/lib/gh-request-approval.sh \
            bin/lib/issue-repo.sh \
            githooks/post-merge \
            githooks/pre-commit \
            test/claude-digest.test.sh \
            test/claude-hook-git-guard.test.sh \
            test/claude-review.test.sh \
            test/claude-session.test.sh \
            test/claude-spinoff.test.sh \
            test/claude-stop-bg.test.sh \
            test/claude-worktree.test.sh \
            test/db-query.test.sh \
            test/deploy.test.sh \
            test/dotrc-config.test.sh \
            test/gh-automerge.test.sh \
            test/gh-issue-file.test.sh \
            test/gh-issue-group.test.sh \
            test/gh-mise.test.sh \
            test/gh-request-approval.test.sh \
            test/gh-wrappers.test.sh \
            test/issue-crawl.test.sh \
            test/git-reap-gone.test.sh \
            test/post-merge-hook.test.sh \
            test/pre-commit-hook.test.sh \
            test/lib/sandbox.sh \
            test/sandbox-usage.test.sh \
            test/skill-permissions.test.sh
