# Tracked, so a fresh checkout picks the Claude Code account without a
# hand-written mise config. This repo is public: nothing secret goes here.
#
# CLAUDE_CONFIG_DIR: work in dotrc runs under the personal subscription's config
# dir, while every other repo keeps the default ~/.claude. bin/deploy.sh
# populates the dir and trusts this checkout (worktrees included).
#
# The personal GitHub PAT stays out of this file on purpose. It lives in
# mise.gh.local.toml, which mise reads only under MISE_ENV=gh; loading it from
# here would put it in every shell's env again (see bin/lib/gh-mise.sh).
[env]
CLAUDE_CONFIG_DIR = "{{env.HOME}}/.claude-personal"
