# Prefix
set -g prefix C-q

# Color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",$TERM:Tc"

# Which Claude Code account a pane runs under is per repo: mise sets
# CLAUDE_CONFIG_DIR from the cwd (dotrc's mise.local.toml). A server started from a
# shell that had it set would copy the value into its global env and hand it to
# every pane, in any repo, and `mise activate` never unsets a variable it did not
# set itself. Drop it so each pane's shell decides from its own cwd. Measured:
# this runs before the first session is created, so even that session's pane
# starts without it.
set-environment -gu CLAUDE_CONFIG_DIR

# Advice from Neovim :checkhealth
set -sg escape-time 10
set -g focus-events on

# vim-like operations
# change pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize pane
bind -r H resize-pane -L 20
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r L resize-pane -R 20

# set vi bindings in copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# open new pane in same directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key \" split-window -c "#{pane_current_path}"

# claude-queue
set -g status-interval 5
set -g status-right '#(claude-queue status) | #[fg=black,bold]#S#[default] | %H:%M'
set -g status-right-length 80
# q scopes to the current repo (main checkout + its .worktrees/*); -d pins the
# popup's cwd to the launching pane's so --repo-scope has a repo to resolve.
# Q keeps the unscoped, everything-included view.
bind-key q display-popup -E -d "#{pane_current_path}" -w 80% -h 60% "claude-queue picker --repo-scope"
bind-key Q display-popup -E -w 80% -h 60% "claude-queue picker --show-working --show-stale --show-resumable"

# claude-digest
# g reads the latest digest, G picks a past day from the list. Not the same
# pairing as q/Q above -- q/Q are both a picker (list), differing only in
# scope (repo-scoped vs. everything); g/G differ in list vs. no-list (g shows
# the latest entry directly, G opens a picker across days). Both letters are
# unbound in tmux's default prefix table (E is not: it is select-layout -E).
# There is deliberately no shell-startup hook for this: it would replay on
# every new pane.
# No pager is named here: claude-digest picks one itself (bat, else less, else
# cat), and pinning bat here would break the popup wherever bat is absent.
bind-key g display-popup -E -w 80% -h 80% "claude-digest"
bind-key G display-popup -E -w 80% -h 80% "claude-digest --pick"
