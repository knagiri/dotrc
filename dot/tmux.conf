# Prefix
set -g prefix C-q

# Color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",$TERM:Tc"

# Which Claude Code account a pane runs under is per repo: mise sets
# CLAUDE_CONFIG_DIR from the cwd (dotrc's mise.local.toml). A server started from a
# shell that had it set would copy the value into its global env and hand it to
# every pane, in any repo, and `mise activate` never unsets a variable it did not
# set itself. Drop it so each pane's shell decides from its own cwd. Measured:
# this runs before the first session is created, so even that session's pane
# starts without it.
set-environment -gu CLAUDE_CONFIG_DIR

# Advice from Neovim :checkhealth
set -sg escape-time 10
set -g focus-events on

# vim-like operations
# change pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize pane
bind -r H resize-pane -L 20
bind -r J resize-pane -D 20
bind -r K resize-pane -U 20
bind -r L resize-pane -R 20

# set vi bindings in copy-mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
# Mouse drag only stores a tmux paste buffer (prefixed "mouse"); -C keeps it out of
# the terminal clipboard (OSC 52). The selection stays, so `y` can still send it.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear -C mouse
# Outside copy mode, drag / double / triple click no longer enter copy mode and
# copy (the defaults do, overwriting the terminal clipboard). They still reach
# apps that request the mouse; Shift+drag gives the terminal's native selection.
bind -T root MouseDrag1Pane   if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
bind -T root DoubleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
bind -T root TripleClick1Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
# Clicks no longer select panes, borders no longer resize, middle click no longer
# pastes, and right click no longer opens menus. Clicks still reach apps that
# request the mouse.
bind -T root MouseDown1Pane send-keys -M
bind -T root MouseDown2Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
bind -T root MouseDown3Pane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M }
unbind -T copy-mode-vi MouseDown1Pane
unbind -T root MouseDown1Border
unbind -T root MouseDrag1Border
unbind -T root M-MouseDown3Pane
unbind -T root MouseDown3Status
unbind -T root M-MouseDown3Status
unbind -T root MouseDown3StatusLeft
unbind -T root M-MouseDown3StatusLeft
unbind -T root MouseDown3Empty
unbind -T root M-MouseDown3Empty

# open new pane in same directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key \" split-window -c "#{pane_current_path}"

# claude-queue
set -g status-interval 5
set -g status-right '#(claude-queue status) | #[fg=black,bold]#S#[default] | %H:%M'
set -g status-right-length 80
# q shows every open state (working included) of the current repo (main checkout +
# its .worktrees/*); -d pins the popup's cwd to the launching pane's so
# --repo-scope has a repo to resolve. Q shows the same states across all repos.
bind-key q display-popup -E -d "#{pane_current_path}" -w 80% -h 60% "claude-queue picker --repo-scope --show-working"
bind-key Q display-popup -E -w 80% -h 60% "claude-queue picker --show-working"
# C-h / C-l walk back / forward through the sessions the picker jumped to, like
# a browser's history (h / l stay select-pane). The client and pane are passed
# because the tmux that run-shell invokes is a client of its own, and with several
# clients attached it would not know which one pressed the key.
bind-key C-h run-shell "claude-queue nav back --client '#{client_name}' --pane '#{pane_id}'"
bind-key C-l run-shell "claude-queue nav forward --client '#{client_name}' --pane '#{pane_id}'"

# claude-digest
# g reads the latest digest, G picks a past day from the list. Not the same
# pairing as q/Q above -- q/Q are both a picker (list), differing only in
# scope (repo-scoped vs. everything); g/G differ in list vs. no-list (g shows
# the latest entry directly, G opens a picker across days). Both letters are
# unbound in tmux's default prefix table (E is not: it is select-layout -E).
# There is deliberately no shell-startup hook for this: it would replay on
# every new pane.
# No pager is named here: claude-digest picks one itself (bat, else less, else
# cat), and pinning bat here would break the popup wherever bat is absent.
bind-key g display-popup -E -w 80% -h 80% "claude-digest"
bind-key G display-popup -E -w 80% -h 80% "claude-digest --pick"
